name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  shell-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libjson-c-dev pkg-config shellcheck shfmt

      - name: Install ShellSpec
        env:
          SHELLSPEC_VERSION: 0.28.1
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/lib"
          git clone --depth 1 --branch "$SHELLSPEC_VERSION" \
            https://github.com/shellspec/shellspec.git "$HOME/.local/lib/shellspec"
          ln -s "$HOME/.local/lib/shellspec/shellspec" "$HOME/.local/bin/shellspec"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellspec" --version

      - name: Build ucode
        env:
          UCODE_COMMIT: 85922056ef7abeace3cca3ab28bc1ac2d88e31b1
        run: |
          git init /tmp/ucode
          git -C /tmp/ucode remote add origin https://github.com/jow-/ucode.git
          git -C /tmp/ucode fetch --depth 1 origin "$UCODE_COMMIT"
          git -C /tmp/ucode checkout --detach FETCH_HEAD
          cmake -S /tmp/ucode -B /tmp/ucode/build \
            -DCMAKE_C_FLAGS="-Wno-error=discarded-qualifiers" \
            -DDEBUG_SUPPORT=OFF \
            -DFS_SUPPORT=ON \
            -DIO_SUPPORT=OFF \
            -DMATH_SUPPORT=OFF \
            -DUBUS_SUPPORT=OFF \
            -DUCI_SUPPORT=OFF \
            -DRTNL_SUPPORT=OFF \
            -DNL80211_SUPPORT=OFF \
            -DRESOLV_SUPPORT=OFF \
            -DSTRUCT_SUPPORT=OFF \
            -DULOOP_SUPPORT=OFF \
            -DLOG_SUPPORT=OFF \
            -DSOCKET_SUPPORT=OFF \
            -DZLIB_SUPPORT=OFF \
            -DDIGEST_SUPPORT=OFF
          cmake --build /tmp/ucode/build --parallel
          sudo cmake --install /tmp/ucode/build
          sudo ldconfig

      - name: Run shell lint
        shell: bash
        run: sh scripts/lint.sh

      - name: Run tests
        shell: bash
        run: REQUIRE_UCODE=1 shellspec
